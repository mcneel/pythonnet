name: Main

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test:
    name: Build and Test
    runs-on: ${{ matrix.os.instance }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          # 64-bit only, matching what Rhino ships
          - category: windows
            platform: x64
            instance: windows-latest

          - category: ubuntu
            platform: x64
            instance: ubuntu-22.04

          # macOS dropped for now: macos-13 runners are retired and arm64 runners need Mono setup work

        # Rhino 9 ships Python 3.13
        python: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # projects target net9.0 and the Roslyn toolset package needs .NET 8+ msbuild
          dotnet-version: '9.0.x'

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.os.platform }}

      - name: Install dependencies
        run: |
          pip install --upgrade -r requirements.txt
          pip install numpy # for tests

      - name: Build and Install
        run: |
          pip install -v .

      - name: Set Python DLL path and PYTHONHOME (non Windows)
        if: ${{ matrix.os.category != 'windows' }}
        run: |
          echo PYTHONNET_PYDLL=$(python -m find_libpython) >> $GITHUB_ENV
          echo PYTHONHOME=$(python -c 'import sys; print(sys.prefix)') >> $GITHUB_ENV

      - name: Set Python DLL path and PYTHONHOME (Windows)
        if: ${{ matrix.os.category == 'windows' }}
        run: |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append -InputObject "PYTHONNET_PYDLL=$(python -m find_libpython)"
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append -InputObject "PYTHONHOME=$(python -c 'import sys; print(sys.prefix)')"

      # .NET Core only (Rhino 9 runs on net9.0); .NET Framework and Mono are not tested
      - name: Embedding tests
        run: dotnet test --framework net9.0 --runtime any-${{ matrix.os.platform }} --logger "console;verbosity=detailed" src/embed_tests/

      - name: Python Tests (.NET Core)
        run: pytest --runtime coreclr

      - name: Python tests run from .NET
        run: dotnet test --framework net9.0 --runtime any-${{ matrix.os.platform }} src/python_tests_runner/
